<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corfu Guide | Places List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="top-row">
      <div class="heading">
        <p class="eyebrow">Ionian island · Greece</p>
        <h1>Places to visit</h1>
      </div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">← Back to map</a>
      </nav>
    </div>
  </header>

  <main class="list-container">
    <div id="places-list">
      <!-- Places will be injected here by JS -->
    </div>
  </main>

  <script src="places.js"></script>
  <script>
    const listContainer = document.getElementById('places-list');

    // Category labels mapping for consistency with map view
    const categoryLabels = {
      beach: "Beach",
      history: "Historic site",
      village: "Village",
      food: "Food",
      nature: "Nature",
      hotel: "Hotel"
    };

    places.forEach(place => {
      const card = document.createElement('a');
      card.className = 'place-card';
      card.href = `index.html?place=${encodeURIComponent(place.name)}`;

      card.innerHTML = `
        <span class="category cat-${place.category}">${categoryLabels[place.category] || place.category}</span>
        <h3>${place.name}</h3>
        <p>${place.description}</p>
      `;
      listContainer.appendChild(card);
    });
  </script>
</body>
</html>
