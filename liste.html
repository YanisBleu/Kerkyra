<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corfu Guide | Places List</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .list-container {
      padding: 2rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
      font-family: "Trebuchet MS", system-ui, sans-serif;
    }
    #places-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }
    @media (max-width: 900px) {
      #places-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 600px) {
      #places-list {
        grid-template-columns: 1fr;
      }
    }
    .place-card {
      background: #fff;
      padding: 1.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: none;
    }
    .place-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.1);
    }
    .place-card h3 {
      margin: 0 0 0.5rem;
      color: #16324f;
    }
    .place-card .category {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: block;
      padding: 0.2rem 0.5rem;
      width: fit-content;
    }
    .place-card p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #4a5568;
    }
    /* Category Colors */
    .cat-beach { background: #fef3c7; color: #d97706; }
    .cat-history { background: #e5d3b3; color: #78350f; }
    .cat-village { background: #dcfce7; color: #166534; }
    .cat-food { background: #ffedd5; color: #9a3412; }
    .cat-nature { background: #dbeafe; color: #1e40af; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="top-row">
      <div class="heading">
        <p class="eyebrow">Ionian island · Greece</p>
        <h1>Places to visit</h1>
      </div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">← Back to map</a>
      </nav>
    </div>
  </header>

  <main class="list-container">
    <div id="places-list">
      <!-- Places will be injected here by JS -->
    </div>
  </main>

  <script src="places.js"></script>
  <script>
    const listContainer = document.getElementById('places-list');

    places.forEach(place => {
      const card = document.createElement('div');
      card.className = 'place-card';
      
      // On clique sur une carte pour retourner à la carte et centrer sur le lieu
      // On utilise un paramètre URL pour savoir quel lieu ouvrir
      card.onclick = () => {
        const params = new URLSearchParams();
        params.set('place', place.name);
        window.location.href = `index.html?${params.toString()}`;
      };

      card.innerHTML = `
        <span class="category cat-${place.category}">${place.category}</span>
        <h3>${place.name}</h3>
        <p>${place.description}</p>
      `;
      listContainer.appendChild(card);
    });
  </script>
</body>
</html>
